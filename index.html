<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #120a24; font-family: system-ui, sans-serif; color: #ffe9c4; }
      #hud { position: fixed; top: 12px; left: 12px; background: rgba(20, 10, 36, 0.7); padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 15px; }
      #hud .lbl { color: #c9a8ff; display: inline-block; min-width: 150px; }
      #help { position: fixed; bottom: 12px; left: 12px; font-size: 13px; color: #c9b8e8; background: rgba(20, 10, 36, 0.6); padding: 6px 10px; border-radius: 8px; }
      #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #ffd27a; opacity: 0; text-shadow: 0 0 8px #000; }
      #overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(18, 10, 36, 0.8); text-align: center; }
      #overlay h1 { color: #ffb347; font-size: 40px; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <div id="help">WASD/mũi tên: đi · Kéo chuột hoặc Q/Z: xoay camera · Space: nhảy · E: nạp đèn · F/Shift: tỏa sáng · R: chơi lại (sau khi kết thúc)</div>
    <script type="module" src="/src/web/main.js"></script>
  </body>
</html>
